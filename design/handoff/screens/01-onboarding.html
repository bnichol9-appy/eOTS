<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Trick or Tinsel — Meet your elves</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--bg:#FBF5EA;--surface:#F3E9D8;--line:#E3D6C0;--text:#241A3D;--muted:#6B5F86;--body:#3D3358;--acc-text:#A4470B;--ph:#EFE3CF;--ph-stripe:rgba(36,26,61,.06);--pine:#2F7A5B;--overlay:rgba(251,245,234,.92);--dash:#C9B9A0}
.dark{--bg:#17122B;--surface:#241C40;--line:#3A3060;--text:#F4EBD0;--muted:#B9AFCF;--body:#D9D1E6;--acc-text:#FF8A3D;--ph:#2A2148;--ph-stripe:rgba(244,235,208,.06);--pine:#9BE3A8;--overlay:rgba(23,18,43,.85);--dash:#5A4E85}
a{color:var(--acc-text)}
input::placeholder{color:var(--muted)}
</style>
</head>
<body>


<div class="light" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 22px 22px 6px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1; display: flex; gap: 6px">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #FF8A3D"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #FF8A3D"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--line)"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--line)"></div>
    </div>
    <span style="font-size: 13px; color: var(--muted)">2 of 4</span>
  </header>

  <main style="flex: 1; padding: 14px 22px 0; display: flex; flex-direction: column; gap: 18px">
    <div>
      <h1 style="margin: 0; font-family: 'Gloock', serif; font-weight: 400; font-size: 32px; line-height: 1.08">Who's on the<br>night shift?</h1>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: var(--body)">Tell us about your elves and your kids. Every idea gets pitched at the right level of mischief.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted)">Your elves</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface)">
          <span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: #FF8A3D; color: #17122B; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">P</span>
          <label for="elf1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">First elf's name</label>
          <input id="elf1" value="Pip" style="min-width: 0px; flex: 1 1 0%; border: 0px; background: transparent; color: var(--text); font: 500 17px &quot;DM Sans&quot;, sans-serif;">
        </div>
        <div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface)">
          <span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: var(--pine); color: var(--bg); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">M</span>
          <label for="elf2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Second elf's name</label>
          <input id="elf2" value="Moss" style="min-width: 0px; flex: 1 1 0%; border: 0px; background: transparent; color: var(--text); font: 500 17px &quot;DM Sans&quot;, sans-serif;">
        </div>
      </div>
      <button style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--acc-text); font: 700 14px 'DM Sans', sans-serif">+ Add another elf</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted)">Kids' ages (pick all)</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FF8A3D; color: #17122B; font: 700 14px 'DM Sans', sans-serif">Under 5</button>
        <button aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FF8A3D; color: #17122B; font: 700 14px 'DM Sans', sans-serif">5–8</button>
        <button aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 14px 'DM Sans', sans-serif">9–12</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted)">Spook level</span>
        <span style="font-size: 14px; font-weight: 700">A shiver</span>
      </div>
      <div style="display: flex; gap: 6px">
        
          <button aria-label="Spook level 1: Cosy" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 10px; cursor: pointer; border: 0; background: #FF8A3D"></button>
        
          <button aria-label="Spook level 2: A shiver" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 10px; cursor: pointer; border: 0; background: #FF8A3D"></button>
        
          <button aria-label="Spook level 3: Spooky-ish" aria-pressed="false" style="flex: 1; height: 44px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: transparent"></button>
        
          <button aria-label="Spook level 4: Spooky" aria-pressed="false" style="flex: 1; height: 44px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: transparent"></button>
        
          <button aria-label="Spook level 5: Properly spooky" aria-pressed="false" style="flex: 1; height: 44px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: transparent"></button>
        
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--muted)"><span>Cosy</span><span>Properly spooky</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted)">Most time you'll give it at 11pm</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 15px 'DM Sans', sans-serif">5 min</button>
        <button aria-pressed="true" style="height: 48px; border-radius: 14px; border: 1.5px solid #FF8A3D; background: var(--surface); color: var(--text); font: 700 15px 'DM Sans', sans-serif">10 min</button>
        <button aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 15px 'DM Sans', sans-serif">20 min</button>
      </div>
    </div>
  </main>

  <div style="padding: 14px 22px 26px">
    <a href="Rooms.dc.html" style="height: 56px; border-radius: 28px; background: #FF8A3D; color: #17122B; font: 700 16px 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Next: show us your house <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>




</body></html>
