<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Trick or Tinsel — Add a room</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--bg:#FBF5EA;--surface:#F3E9D8;--line:#E3D6C0;--text:#241A3D;--muted:#6B5F86;--body:#3D3358;--acc-text:#A4470B;--ph:#EFE3CF;--ph-stripe:rgba(36,26,61,.06);--pine:#2F7A5B;--overlay:rgba(251,245,234,.92);--dash:#C9B9A0}
.dark{--bg:#17122B;--surface:#241C40;--line:#3A3060;--text:#F4EBD0;--muted:#B9AFCF;--body:#D9D1E6;--acc-text:#FF8A3D;--ph:#2A2148;--ph-stripe:rgba(244,235,208,.06);--pine:#9BE3A8;--overlay:rgba(23,18,43,.85);--dash:#5A4E85}
.ph{background-color:var(--ph);background-image:repeating-linear-gradient(135deg,var(--ph-stripe) 0 10px,transparent 10px 20px)}
a{color:var(--acc-text)}
input[type=checkbox]{width:22px;height:22px;accent-color:#E0701F;margin:0}
</style>
</head>
<body>


<div class="light" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 24px 22px 10px; display: flex; align-items: center; gap: 12px">
    <a href="Rooms.dc.html" aria-label="Back to rooms" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1">
      <label for="roomname" style="display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted)">Room name</label>
      <input id="roomname" value="Living room" style="width: 100%; box-sizing: border-box; border: 0px; padding: 0px; background: transparent; color: var(--text); font: 400 24px Gloock, serif;">
    </div>
  </header>

  <div style="padding: 0 22px">
    <div class="ph" style="position: relative; height: 236px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden">
      <div style="position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--muted)">[Your living-room photo]</div>
      <div style="position: absolute; left: 34px; top: 36px; width: 28px; height: 28px; border-radius: 14px; background: #FF8A3D; color: #17122B; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">1</div>
      <div style="position: absolute; left: 150px; top: 70px; width: 28px; height: 28px; border-radius: 14px; background: #FF8A3D; color: #17122B; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">2</div>
      <div style="position: absolute; left: 270px; top: 48px; width: 28px; height: 28px; border-radius: 14px; background: #FF8A3D; color: #17122B; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">3</div>
      <div style="position: absolute; left: 96px; top: 150px; width: 28px; height: 28px; border-radius: 14px; background: #FF8A3D; color: #17122B; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">4</div>
      <div style="position: absolute; left: 228px; top: 140px; width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--text); background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
      <div style="position: absolute; right: 12px; top: 12px; padding: 6px 10px; border-radius: 999px; background: var(--overlay); font-size: 12px">5 spots found</div>
    </div>
  </div>

  <main style="flex: 1; padding: 16px 22px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px">Spots the elves can use</div>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line)"><input type="checkbox" checked="" style=""><span style="flex: 1; font-size: 15px"><strong>1</strong> · Bookshelf, top row</span><span style="font-size: 12px; color: var(--muted)">Fits both</span></label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line)"><input type="checkbox" checked="" style=""><span style="flex: 1; font-size: 15px"><strong>2</strong> · Mantelpiece</span><span style="font-size: 12px; color: var(--muted)">Fits both</span></label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line)"><input type="checkbox" checked="" style=""><span style="flex: 1; font-size: 15px"><strong>3</strong> · Curtain pole</span><span style="font-size: 12px; color: var(--muted)">One elf</span></label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line)"><input type="checkbox" checked="" style=""><span style="flex: 1; font-size: 15px"><strong>4</strong> · Coffee table</span><span style="font-size: 12px; color: var(--muted)">Low · reachable</span></label>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; color: var(--muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M6 6l12 12"></path></svg><span style="flex: 1; font-size: 15px">Log burner — <em>never</em>, it gets hot</span></div>
  </main>

  <div style="padding: 12px 22px 28px; display: flex; gap: 10px">
    <button style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 600 15px 'DM Sans', sans-serif">Retake</button>
    <a href="Rooms.dc.html" style="flex: 2; height: 52px; border-radius: 26px; background: #FF8A3D; color: #17122B; font: 700 15px 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Save living room</a>
  </div>
</div>




</body></html>
